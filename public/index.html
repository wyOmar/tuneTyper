<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="mGyMTMTchgWR3Bz98RD9ACaNmpuz8U5zopN5UWPsy0c" />
    <link rel="stylesheet" href="styles.css">

    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png">
    <link rel="manifest" href="/favicon/site.webmanifest">
    <link rel="shortcut icon" href="/favicon/favicon.ico">

    <title>TuneTyper - Type Song Lyrics &amp; Guess the Tune</title>
    <meta name="description" content="Type lyrics from your favorite artists, test your typing speed, and guess the song in TuneTyper. The ultimate music typing game. Play free online now!">
    <meta name="keywords" content="typing game, music game, song lyrics typing, WPM typing test, typing speed, music lovers, guess the tune, typing and music">
    <meta name="author" content="Vincent Chan">
    <meta name="robots" content="index, follow">
    <meta property="og:title" content="TuneTyper - Type Song Lyrics &amp; Guess the Tune">
    <meta property="og:description" content="Type lyrics from your favorite artists, guess the tune, and beat your WPM in TuneTyper. Play free in your browser!">
    <meta property="og:url" content="https://type.vincentchan.uk">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://type.vincentchan.uk/og-image.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="TuneTyper: type song lyrics, guess the song, and beat your WPM. Play free at type.vincentchan.uk.">
    <meta property="og:site_name" content="TuneTyper">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="TuneTyper - Type Song Lyrics &amp; Guess the Tune">
    <meta name="twitter:description" content="Type lyrics from your favorite artists, guess the tune, and beat your WPM in TuneTyper. Play free in your browser!">
    <meta name="twitter:image" content="https://type.vincentchan.uk/og-image.png">
    <meta name="twitter:image:alt" content="TuneTyper: type song lyrics, guess the song, and beat your WPM. Play free at type.vincentchan.uk.">
    
</head>
<body>

    <div class="navbar">
        <img src="/favicon/favicon-32x32.png" alt="Site Logo" class="navbar-logo">
        <h1 class="navbar-title">TuneTyper</h1>
    </div>
    
    <div class="container">


        <div class="input-section">
            
            <input type="text" id="artist-input" placeholder="Searching for...">
            <select id="search-type">
                <option value="artist" selected>Artist</option>
                <option value="song">Song</option>
            </select>


            <button id="start-btn">Go</button>
        </div>

        <!-- Monkeytype-style mode toggles (checked = included in the typing text) -->
        <div class="config-bar" role="group" aria-label="Typing options">
            <label for="remove-punctuation" class="config-toggle">
                <input type="checkbox" id="remove-punctuation" class="visually-hidden">
                <span class="config-toggle-text"><span class="config-icon" aria-hidden="true">@</span>punctuation</span>
            </label>
            <label for="include-numbers" class="config-toggle">
                <input type="checkbox" id="include-numbers" class="visually-hidden">
                <span class="config-toggle-text"><span class="config-icon" aria-hidden="true">#</span>numbers</span>
            </label>
            <span class="config-divider" aria-hidden="true"></span>
            <label for="remove-adlibs" class="config-toggle">
                <input type="checkbox" id="remove-adlibs" class="visually-hidden" checked>
                <span class="config-toggle-text"><span class="config-icon" aria-hidden="true">( )</span>ad-libs</span>
            </label>
        </div>

        <div class="game-section">
            <div id="challenge-banner" class="challenge-banner" style="display: none;"></div>
            <p id="display-text" class="text-display"></p>
            <div class="typing-area-container">
                <textarea id="typing-area" rows="3" placeholder="Start typing here..." disabled></textarea>
                <button id="end-game-btn" style="display: none;">End Game</button>
            </div>
            <p id="wpm-result" class="wpmresult-text"></p>
        </div>

        <div id="guess-section" class="guess-section" style="display: none;">
            <h3 class="guess-heading">🎵 Guess the Song</h3>
            
            <div id="mystery-title" class="mystery-title" aria-label="Song title pattern"></div>

            <div class="hints-panel">
                <div class="hints-top-bar">
                    <span id="hint-stage-badge" class="hint-badge">Hint 1 / 5</span>
                    <div id="attempt-tracker" class="attempt-tracker" aria-label="Attempts tracker">
                        <span class="attempt-dot current"></span>
                        <span class="attempt-dot"></span>
                        <span class="attempt-dot"></span>
                        <span class="attempt-dot"></span>
                        <span class="attempt-dot"></span>
                    </div>
                </div>

                <div class="hints-body">
                    <div class="hint-cover-box">
                        <img id="hint-cover-img" class="hint-cover-img" src="" alt="Album Art">
                        <span class="hint-cover-label">Album Art</span>
                    </div>

                    <div class="hint-details-box">
                        <div id="hint-badges" class="hint-badges"></div>
                        <div class="hint-player">
                            <button id="snippet-play-btn" class="snippet-btn" type="button">
                                <span id="snippet-icon" class="snippet-icon">▶</span>
                                <span id="snippet-label">Play snippet (2s)</span>
                            </button>
                            <div class="snippet-track">
                                <div id="snippet-bar" class="snippet-bar"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="guess-input-wrapper">
                <div class="guess-input-container">
                    <input type="text" id="guess-input" placeholder="Type song name or pick suggestion..." autocomplete="off">
                    <button id="guess-submit-btn" class="guess-submit-btn" type="button">Guess</button>
                    <button id="skip-btn" class="skip-btn" type="button">Skip</button>
                </div>
                <ul id="guess-suggestions" class="guess-suggestions" style="display: none;"></ul>
            </div>
        </div>

        <div id="song-info" class="song-info"></div>
    </div>
    <footer class="footer">
        <p>
          View this project on
          <a href="https://github.com/wyOmar/tuneTyper" target="_blank"
            >GitHub</a>
        </p>
      </footer>
    <script src="script.js"></script>
    <script async src="https://scripts.simpleanalyticscdn.com/latest.js"></script>


    <script type="application/ld+json">
        {
          "@context": "https://schema.org",
          "@type": "WebSite",
          "name": "TuneTyper",
          "url": "https://type.vincentchan.uk",
          "description": "A fun typing game for music lovers. Improve and test your typing speed on your favourite song lyrics!",
          "author": {
            "@type": "Person",
            "name": "Vincent Chan"
          }
        }
    </script>

</body>

</html>
